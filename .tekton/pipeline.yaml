apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: spring-cicd
spec:
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone-repo
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: subdirectory
          value: ""
        - name: deleteExisting
          value: "true"

    - name: build-app
      runAfter: [clone-repo]
      taskRef:
        name: spring-build
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: push-image
      runAfter: [build-app]
      taskRef:
        name: buildah-push
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: deploy
      runAfter: [push-image]
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
        - name: SCRIPT
          value: |
            IMAGE=$(cat $(workspaces.source.path)/image-ref.txt 2>/dev/null || echo "")
            # Fallback если результат не передан
            if [ -z "$IMAGE" ]; then
              IMAGE=$(tasks.push-image.results.IMAGE_REF)
            fi
            oc set image deployment/spring-app spring-app="$IMAGE"
      workspaces:
        - name: manifest-dir
          workspace: shared-workspace